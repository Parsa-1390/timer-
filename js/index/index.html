<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <title>timer|تایمر</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="bootstrap.min.css"><style>
    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        min-height: 100vh;

        display: flex;
        flex-direction: column;
        align-items: center;

        padding-top: 70px;

        background:
            radial-gradient(
                circle at 50% 0%,
                #3b195c 0%,
                #171225 35%,
                #08070d 75%
            );

        font-family: Arial, sans-serif;
        color: white;
    }

    /* دکمه */
    #start  {
        border: none;
        padding: 13px 50px;

        border-radius: 50px;

        background: linear-gradient(
            135deg,
            #b84cff,
            #ff4fa3
        );

        color: white;

        font-size: 30px;
        font-weight: bold;

        cursor: pointer;

        box-shadow:
            0 8px 30px rgba(210, 70, 255, 0.3);

        transition: 0.3s;
    }

    #reset{
        border: none;
        padding: 13px 50px;

        border-radius: 50px;

        background: linear-gradient(
            135deg,
            #b84cff,
            #ff4fa3
        );

        color: white;

        font-size: 30px;
        font-weight: bold;

        cursor: pointer;

        box-shadow:
            0 8px 30px rgba(210, 70, 255, 0.3);

        transition: 0.3s;
    }

    #start:hover {
        transform: translateY(-3px);

        box-shadow:
            0 12px 40px rgba(255, 70, 190, 0.5);
    }

    #start:active {
        transform: scale(0.95);
    }


    /* ورودی ها */
    body > div:first-of-type {
        display: flex;
        gap: 14px;

        margin-top: 35px;
        margin-bottom: 40px;
    }

    body > div:first-of-type input {
        width: 85px;
        height: 60px;

        border: 1px solid rgba(255,255,255,0.12);

        border-radius: 16px;

        background: rgba(255,255,255,0.06);

        color: white;

        text-align: center;

        font-size: 23px;
        font-weight: bold;

        outline: none;

        transition: 0.3s;

        backdrop-filter: blur(10px);
    }

    body > div:first-of-type input:focus {
        border-color: #d65cff;

        box-shadow:
            0 0 20px rgba(214, 92, 255, 0.25);
    }


    /* کارت تایمر */
    #show {
        width: min(850px, 90%) !important;
        text-align: center;
        height: 260px !important;

        display: flex;
        align-items: center;
        justify-content: center;

        margin: 0 auto;

        border-radius: 35px;

        border: 1px solid rgba(255,255,255,0.12);

        background:
            linear-gradient(
                145deg,
                rgba(255,255,255,0.10),
                rgba(255,255,255,0.025)
            ) !important;

        backdrop-filter: blur(20px);

        color: #ff72c8;

        font-family: "Courier New", monospace;

        font-variant-numeric: tabular-nums;

        font-size: clamp(55px, 10vw, 125px) !important;

        font-weight: bold;

        letter-spacing: 7px;

        direction: ltr;

        white-space: nowrap;

        text-shadow:
            0 0 10px rgba(255, 80, 190, 0.8),
            0 0 35px rgba(255, 80, 190, 0.35);

        box-shadow:
            0 25px 70px rgba(0,0,0,0.5),
            inset 0 0 40px rgba(255,80,190,0.03);

        position: relative;
        overflow: hidden;
    }
    input[type="number"] {
    -moz-appearance: textfield;
}

input[type="number"]::-webkit-inner-spin-button,
input[type="number"]::-webkit-outer-spin-button {
    -webkit-appearance: none;
    margin: 0;
}

    /* نور بالای کارت */
    #show::before {
        content: "";

        position: absolute;

        top: 0;
        left: 20%;

        width: 60%;
        height: 1px;

        background: linear-gradient(
            90deg,
            transparent,
            #ff5fc7,
            transparent
        );

        box-shadow:
            0 0 20px #ff5fc7;
    }


    /* موبایل */
    @media (max-width: 600px) {

        body {
            padding-top: 40px;
        }

        body > div:first-of-type {
            gap: 8px;
        }

        body > div:first-of-type input {
            width: 70px;
            height: 52px;
            font-size: 19px;
        }

        #show {
            width: 94% !important;
            height: 180px !important;

            font-size: 48px !important;

            letter-spacing: 4px;
        }
    }
</style>
</head>
<body>
    <h1 style="
         
        background: linear-gradient(
            135deg,
            #b84cff,
            #ff4fa3
        );
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        font-weight: bold;
        font-size: 70px;
        ">
        Hello! this is a timer</h1>
    <div>
        <input id="hour" maxlength="3" onkeydown="menha(event);" oninput="this.value = this.value.slice(0, 2);"  type="number" min="0" max="99" placeholder="HH">
        <input id="minut" maxlength="2" onkeydown="menha(event);" oninput="this.value = this.value.slice(0, 2);" type="number" min="0" max="59" placeholder="MM">
        <input id="secend" maxlength="2" onkeydown="menha(event);" oninput="this.value = this.value.slice(0, 2);" type="number" min="0" max="59" placeholder="SS">
    </div>
    <button id="start" onclick="start();">start</button>
    <br>
    <div id="show"></div>
    <br>
    <button id="reset"  onclick="resetTimer();">reset</button>
    <!-- <input type="text" id="e" > -->
    <script src="../js/js.js"></script>
    
</body>
</html>
